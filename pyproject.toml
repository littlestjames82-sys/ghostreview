[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostreview"
version = "0.1.0"
description = "Plain-English verdict layer for GhostSlice changes: reads a diff plus optional GhostVerify and GhostScope reports, writes REVIEW.md and review.json"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "code-review", "diff", "ghostslice", "agents"]
dependencies = []

[project.scripts]
ghostreview = "ghostreview.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
